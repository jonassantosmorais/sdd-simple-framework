<svg width="680" height="730" viewBox="0 0 680 730" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SDD pipeline flow</title>
<desc>Seven steps in vertical sequence: optional sdd-idea, sdd-create-prd, sdd-create-techspec, sdd-create-tasks, sdd-execute-task, a review-and-fix loop of sdd-review and sdd-fix-reviews, and finally merge and archive. Legend: gray for optional/end, purple for planning, teal for execution, coral for review and fix.</desc>
<rect x="0" y="0" width="680" height="730" rx="12" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect x="200" y="20" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">sdd-idea</text>
<text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">optional: shape the idea</text>
</g>
<line x1="340" y1="76" x2="340" y2="116" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="200" y="116" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="134" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">sdd-create-prd</text>
<text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">product requirements + stories</text>
</g>
<line x1="340" y1="172" x2="340" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="200" y="212" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="230" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">sdd-create-techspec</text>
<text x="340" y="248" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">technical design + test contract</text>
</g>
<line x1="340" y1="268" x2="340" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="200" y="308" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="326" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">sdd-create-tasks</text>
<text x="340" y="344" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">break into task files</text>
</g>
<line x1="340" y1="364" x2="340" y2="404" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="200" y="404" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="422" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">sdd-execute-task</text>
<text x="340" y="440" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">direct, or run-tasks.sh batch</text>
</g>
<line x1="340" y1="460" x2="340" y2="500" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="200" y="500" width="280" height="76" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="340" y="518" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">review &amp; fix loop</text>
<text x="340" y="536" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">sdd-review, sdd-fix-reviews</text>
<text x="340" y="554" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">&#8635; repeat until clean</text>
</g>
<line x1="340" y1="576" x2="340" y2="616" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="200" y="616" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="634" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">merge &amp; archive</text>
<text x="340" y="652" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">once reviews are clean</text>
</g>

<rect x="65" y="697" width="10" height="10" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="81" y="702" text-anchor="start" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">optional / end</text>
<rect x="225" y="697" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="241" y="702" text-anchor="start" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489">plan</text>
<rect x="315" y="697" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="331" y="702" text-anchor="start" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">execute</text>
<rect x="415" y="697" width="10" height="10" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="431" y="702" text-anchor="start" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#712B13">review &amp; fix</text>
</svg>
